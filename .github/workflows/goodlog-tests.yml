name: Goodlog Tests

on: [push, pull_request, merge_group, workflow_dispatch]

env:
  EVTX_BASELINE_VERSION: v0.8.4

jobs:
  check-baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 7 32-bit
            tgz: win7-x86.tgz
            dir: win7-x86
            cache_key: baseline-win7-x86
          - name: Windows 10
            tgz: win10-client.tgz
            dir: Logs_Client
            cache_key: baseline-win10-client
          - name: Windows 11
            tgz: win11-client.tgz
            dir: Logs_Win11
            cache_key: baseline-win11-client
          - name: Windows 11 2023
            tgz: win11-client-2023.tgz
            dir: Logs_Win11_2023
            cache_key: baseline-win11-client-2023
          - name: Windows 2022
            tgz: win2022-evtx.tgz
            dir: win2022-evtx
            cache_key: baseline-win2022-evtx
          - name: Windows 2022 Domain Controller
            tgz: win2022-ad.tgz
            dir: Win2022-AD
            cache_key: baseline-win2022-ad
          - name: Windows 2022 Azure
            tgz: win2022-0-20348-azure.tgz
            dir: win2022-0-20348-azure
            cache_key: baseline-win2022-0-20348-azure

    steps:
    - uses: actions/checkout@v5

    - name: Cache evtx-sigma-checker
      id: cache-evtx-checker
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: evtx-sigma-checker
        key: evtx-sigma-checker-${{ env.EVTX_BASELINE_VERSION }}

    - name: Download evtx-sigma-checker
      if: steps.cache-evtx-checker.outputs.cache-hit != 'true'
      run: wget --no-verbose https://github.com/NextronSystems/evtx-baseline/releases/download/$EVTX_BASELINE_VERSION/evtx-sigma-checker

    - name: Set evtx-sigma-checker permissions
      run: chmod +x evtx-sigma-checker

    - name: Cache ${{ matrix.name }} baseline
      id: cache-baseline
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ matrix.dir }}/
        key: ${{ matrix.cache_key }}-${{ env.EVTX_BASELINE_VERSION }}

    - name: Download and extract ${{ matrix.name }} baseline
      if: steps.cache-baseline.outputs.cache-hit != 'true'
      run: |
        wget --no-verbose https://github.com/NextronSystems/evtx-baseline/releases/download/$EVTX_BASELINE_VERSION/${{ matrix.tgz }}
        tar xzf ${{ matrix.tgz }}

    - name: Verify baseline contains EVTX files
      run: |
        count=$(find ${{ matrix.dir }}/ -name '*.evtx' | wc -l)
        echo "Found ${count} .evtx file(s) in ${{ matrix.dir }}/"
        [ "${count}" -gt 0 ] || { echo "ERROR: No .evtx files found"; exit 1; }

    - name: Check for Sigma matches in baseline
      run: ./evtx-sigma-checker --log-source tests/thor.yml --evtx-path ${{ matrix.dir }}/ --rule-path rules/windows/ --rule-path rules-emerging-threats/ --rule-path rules-threat-hunting/ > findings.json

    - name: Show findings excluding known FPs
      run: |
        chmod +x .github/workflows/matchgrep.sh
        ./.github/workflows/matchgrep.sh findings.json .github/workflows/known-FPs.csv

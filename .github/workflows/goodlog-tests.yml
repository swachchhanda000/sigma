# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Goodlog Tests

on: [push, pull_request, merge_group, workflow_dispatch]

env:
  EVTX_BASELINE_VERSION: v0.8.4

jobs:
  check-baseline-win7:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Cache evtx-sigma-checker
      id: cache-evtx-checker
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: evtx-sigma-checker
        key: evtx-sigma-checker-${{ env.EVTX_BASELINE_VERSION }}

    - name: Download evtx-sigma-checker
      if: steps.cache-evtx-checker.outputs.cache-hit != 'true'
      run: wget --no-verbose https://github.com/NextronSystems/evtx-baseline/releases/download/$EVTX_BASELINE_VERSION/evtx-sigma-checker

    - name: Set evtx-sigma-checker permissions
      run: chmod +x evtx-sigma-checker

    - name: Cache Windows 7 32-bit baseline
      id: cache-baseline
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: win7-x86/
        key: baseline-win7-x86-${{ env.EVTX_BASELINE_VERSION }}

    - name: Download and extract Windows 7 32-bit baseline
      if: steps.cache-baseline.outputs.cache-hit != 'true'
      run: |
        wget --no-verbose https://github.com/NextronSystems/evtx-baseline/releases/download/$EVTX_BASELINE_VERSION/win7-x86.tgz
        tar xzf win7-x86.tgz

    - name: Verify baseline contains EVTX files
      run: |
        count=$(find win7-x86/ -name '*.evtx' | wc -l)
        echo "Found ${count} .evtx file(s) in win7-x86/"
        [ "${count}" -gt 0 ] || { echo "ERROR: No .evtx files found"; exit 1; }

    - name: Check for Sigma matches in baseline
      run: python tests/run_goodlog_check.py --evtx-path win7-x86/

    - name: Show findings excluding known FPs
      run: |
        chmod +x .github/workflows/matchgrep.sh
        ./.github/workflows/matchgrep.sh findings.json .github/workflows/known-FPs.csv

